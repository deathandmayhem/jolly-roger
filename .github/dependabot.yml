version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 20
    ignore:
      # Keep this pinned to the version of Node that we're running
      - dependency-name: "@types/node"
        versions: [ ">=23" ]
      # This has tight coupling to the version of swc_core built into
      # @rspack/binding (and @swc/core), both of which Meteor selects. Assume
      # we'll upgrade this when we take Meteor upgrades.
      - dependency-name: "@swc/plugin-styled-components"
      # Meteor selects these versions when we take Meteor upgrades, so they
      # need to stay compatible with the Meteor version.
      - dependency-name: "@meteorjs/rspack"
      - dependency-name: "@rspack/*"
    groups:
      aws:
        patterns:
          - "@aws-sdk/*"
      bugsnag:
        patterns:
          - "@bugsnag/*"
      google:
        patterns:
          - "@googleapis/*"
          - gaxios
      fontawesome:
        patterns:
          - "@fortawesome/*"
      i18next:
        patterns:
          - "i18next"
          - "react-i18next"
      react:
        patterns:
          - "react"
          - "react-dom"
      slate:
        patterns:
          - "slate"
          - "slate-history"
          - "slate-react"
      testing-library:
        patterns:
          - "@testing-library/*"
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"
      oxlint:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
